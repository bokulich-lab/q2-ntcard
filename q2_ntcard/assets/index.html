<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 2rem; color: #17202a; }
    #vis { overflow-x: auto; }
    .note { color: #566573; margin-bottom: 1rem; }
    .error { color: #9c1c1c; white-space: pre-wrap; }
  </style>
</head>
<body>
  <p class="note">All panels use logarithmic axes. Hover over a point for details.</p>
  <div id="vis" role="img" aria-label="Faceted ntCard k-mer histograms"></div>
  <script>
    const spec = __SPEC__;
    vegaEmbed('#vis', spec, {actions: {source: true, compiled: false, editor: true}})
      .catch(error => {
        document.querySelector('#vis').innerHTML =
          `<p class="error">Unable to render Vega-Lite chart: ${error}</p>`;
      });
  </script>
</body>
</html>
