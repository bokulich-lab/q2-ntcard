[project]
name = "q2-ntcard"
authors = [
    { name = "q2-ntcard contributors" }
]
description = "Estimate and explore k-mer coverage histograms with ntCard."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/qiime2/q2-ntcard"

[project.entry-points.'qiime2.plugins']
"q2-ntcard" = "q2_ntcard.plugin_setup:plugin"

[build-system]
requires = ["setuptools", "versioningit", "wheel"]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git-archive"
describe-subst = "$Format:%(describe)$"
default-tag = "0.0.1"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "q2_ntcard/_version.py"

[tool.versioningit]
default-version = "0.0.dev0"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["q2_ntcard*"]

[tool.setuptools.package-data]
q2_ntcard = ["**/*"]
