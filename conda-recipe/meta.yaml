package:
  name: q2-ntcard
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
  - python {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - ntcard >=1.2.2
  - pandas
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  build:
  - python {{ python }}
  - setuptools
  - versioningit
test:
  requires:
  - pytest
  imports:
  - q2_ntcard
  - qiime2.plugins.ntcard
  commands:
  - pytest --pyargs q2_ntcard
about:
  home: https://github.com/qiime2/q2-ntcard
  license: BSD-3-Clause
  license_family: BSD
